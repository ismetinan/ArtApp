# Codemagic CI — Artora iOS build + TestFlight yükleme.
# Flutter projesi repo kökünde değil, `mobile/` alt klasöründe → her adım oraya cd eder.
#
# KULLANICI KURULUMU (Codemagic UI, bir kez):
#   Environment variables bölümünde `appstore_credentials` adlı bir grup oluştur
#   ve şu üç değişkeni ekle (App Store Connect API key'inden):
#     APP_STORE_CONNECT_ISSUER_ID      — Issuer ID (UUID)
#     APP_STORE_CONNECT_KEY_IDENTIFIER — Key ID (10 karakter)
#     APP_STORE_CONNECT_PRIVATE_KEY    — .p8 dosyasının TAM içeriği, "Secure" işaretli
#     CERTIFICATE_PRIVATE_KEY          — imza sertifikasının RSA özel anahtarı
#                                        (~/keystores/ios_cert_key.pem), "Secure"
#   İlk üç isim codemagic-cli-tools'un otomatik okuduğu isimlerdir; birebir böyle olmalı.
#   CERTIFICATE_PRIVATE_KEY kalıcı olmalı: kaybolursa Apple'daki sertifika
#   kullanılamaz hale gelir, revoke edip yeniden üretmek gerekir.
#
# Adlandırılmış "integration" kullanılmıyor: imza sertifikası ve provisioning
# profili aşağıdaki `fetch-signing-files --create` adımında üretiliyor.
# Not: Hiçbir sır bu dosyada tutulmaz.

workflows:
  ios-testflight:
    name: Artora iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore_credentials
      flutter: stable
      xcode: latest
      vars:
        APP_STORE_APPLE_ID: "6797175551" # App Store Connect → Artora → App Information
        BUNDLE_ID: "com.ismetinan.artapp"
        API_BASE: "https://artapp-production.up.railway.app"
    scripts:
      - name: Flutter bağımlılıkları
        script: |
          cd mobile
          flutter pub get
      - name: İmza dosyalarını üret ve uygula
        script: |
          # Sertifika/profil yoksa Apple tarafında oluşturur (--create).
          # --certificate-key KRİTİK: her build sıfır makinede koştuğu için
          # sertifikanın özel anahtarı kalıcı olmalı; yoksa CLI Apple'dan
          # indirdiği sertifikayı kaydedemez ("without certificate private key")
          # ve keychain boş kalır.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain initialize
          keychain add-certificates
          # Tanı: keychain'e gerçekten imza kimliği girdi mi? "0 valid identities
          # found" görünüyorsa sertifika üretilememiştir (bkz. eski sertifikalar).
          security find-identity -v -p codesigning
          cd mobile
          xcode-project use-profiles
      - name: IPA derle (build no otomatik artar)
        script: |
          cd mobile
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 0)
          echo "Son TestFlight build no: $LATEST"
          flutter build ipa --release \
            --build-number=$(($LATEST + 1)) \
            --dart-define=API_BASE=$API_BASE \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Beta test grubuna otomatik atamak istersen (grubu App Store Connect'te
        # önce oluştur), aşağıyı aç:
        # beta_groups:
        #   - Artora Beta
