services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artapp
      POSTGRES_PASSWORD: artapp
      POSTGRES_DB: artapp
    ports:
      - "5433:5432"  # host 5433: native Postgres already owns 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
