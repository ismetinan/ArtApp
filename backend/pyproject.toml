[project]
name = "artapp-backend"
version = "0.1.0"
description = "ArtApp - AI destekli gamified mentor platformu backend'i"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "bcrypt>=4.2",
    "email-validator>=2.2",
    "google-auth>=2.30",
    "boto3>=1.34",
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
